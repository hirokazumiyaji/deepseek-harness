# Auto mode comes from the shipped base row; only the reviewer is scripted.
- id: headless-runner
  inject: [headlessStartup]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: !!js ctx.headlessStartup.sessionId
    json: !!js ctx.headlessStartup.json
    permissionMode: auto
    approvalPolicy: never

- insert:
    - id: headless-auto-review-fixture
      name: '../../../packages/guard/auto-review/tests/fixtures/headless-reviewer.ts'
      config: {}
